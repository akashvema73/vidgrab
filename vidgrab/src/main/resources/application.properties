spring.application.name=vidgrab
server.port=${PORT:8080}

# Database (TiDB Cloud / koi bhi MySQL), values Render env vars se aayengi
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Docker image mein yt-dlp /usr/local/bin mein install hoga
app.ytdlp.path=${YTDLP_PATH:yt-dlp}
app.ffmpeg.enabled=${FFMPEG_ENABLED:true}
app.timeout.seconds=180
